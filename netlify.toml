[build]
  command = "npm run build"
  publish = ".next"

# Post-build hook pour soumettre le sitemap
[build.processing]
  skip_processing = false

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Headers pour améliorer le SEO et la sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Headers spécifiques pour le sitemap (crawl fréquent)
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
    Content-Type = "application/xml"

# Headers pour les images (cache long)
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirections pour SEO (si besoin)
[[redirects]]
  from = "/blog.xml"
  to = "/sitemap.xml"
  status = 301

# ISR (Incremental Static Regeneration) pour les articles de blog
[[redirects]]
  from = "/*/blog"
  to = "/.netlify/functions/___netlify-handler"
  status = 200

[[redirects]]
  from = "/*/blog/*"
  to = "/.netlify/functions/___netlify-handler"
  status = 200

# Fonction serverless pour notifier Google après chaque build
[[plugins]]
  package = "netlify-plugin-submit-sitemap"

  [plugins.inputs]
    baseUrl = "https://opodhotel.com"
    sitemapPath = "/sitemap.xml"
    providers = [
      "google",
      "bing"
    ]
